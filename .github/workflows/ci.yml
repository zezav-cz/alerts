name: CI
"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions pinned to release tags, so a job cannot change under this file
# without a commit here.
jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # Hooks, the test suite in the sandbox, and the release build.
      - run: nix flake check

  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # The sandboxed build is static (no cgo), so the race detector runs here.
      - run: nix develop -c just test
